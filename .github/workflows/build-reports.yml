name: Build reports

on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed Pipeline run ID to publish or recover
        required: true
        type: string
      attempt:
        description: Run attempt (empty selects the latest)
        required: false
        type: string

# Keep archive updates and deployments in the same serialized workflow. The
# publisher also catches up recent runs if Actions replaces a pending run.
concurrency:
  group: build-report-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.repository == 'nix-ocaml/nix-overlays' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      archive_sha: ${{ steps.site.outputs.archive_sha }}
    steps:
      # workflow_run has elevated capabilities. Always use the trusted default
      # branch, never the source PR's checkout, scripts, HTML or flake.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_site.py check-pages --repository "$GITHUB_REPOSITORY"
      - name: Set up Nix
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: cachix/install-nix-action@v31
      - name: Build the trusted report renderer
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        run: nix build --option access-tokens '' --accept-flake-config .#ocaml-ng.ocamlPackages_5_5.nix-ci-build --out-link report-renderer
      - name: Assemble report archive
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt || inputs.attempt }}
          REFRESH_REPORT: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=(--run-id "$SOURCE_RUN_ID")
          if [[ -n "$SOURCE_ATTEMPT" ]]; then args+=(--attempt "$SOURCE_ATTEMPT"); fi
          if [[ "$REFRESH_REPORT" == 'true' ]]; then args+=(--refresh); fi
          python3 scripts/report_site.py build \
            --repository "$GITHUB_REPOSITORY" \
            --renderer "$PWD/report-renderer/bin/nix-ci-build" \
            --output _site "${args[@]}"
      - name: Upload the generated site
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: generated-build-reports
          path: _site/
          include-hidden-files: true
          retention-days: 7
          overwrite: true

  publish:
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # This artifact comes only from the trusted prepare job above. Source PR
      # artifacts are never extracted or executed in this job.
      - uses: actions/download-artifact@v8
        with:
          name: generated-build-reports
          path: _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
          include-hidden-files: true
      - name: Deploy report archive
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Save the bounded archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA: ${{ needs.prepare.outputs.archive_sha }}
        run: |
          gh auth setup-git
          python3 scripts/report_site.py archive \
            --repository "$GITHUB_REPOSITORY" \
            --directory _site --expected-sha "$ARCHIVE_SHA"
      - name: Link published reports
        env:
          REPORT_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '[Open the build explorer](%s)\n' "$REPORT_SITE_URL" >> "$GITHUB_STEP_SUMMARY"
