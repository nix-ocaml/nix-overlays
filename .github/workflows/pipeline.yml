name: Pipeline
on:
  pull_request:
    branches:
    - master
  pull_request_target:
    types: [closed]
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('closed-pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  cancel-closed-pr:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const closedPR = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: closedPR.number,
            });
            // The cleanup job may have queued while the PR was reopened.
            if (pr.state !== 'closed' || pr.merged) return;

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo,
              event: 'pull_request',
              branch: closedPR.head.ref,
              created: `${closedPR.created_at}..${closedPR.closed_at}`,
              per_page: 100,
            });
            for (const run of runs) {
              if (run.status === 'completed' || run.event !== 'pull_request') continue;
              const prs = run.pull_requests ?? [];
              // GitHub can omit PR associations after closure. The query limits
              // the fallback match to runs created during this PR's lifetime.
              const matches = prs.length > 0
                ? prs.some(candidate => candidate.number === closedPR.number)
                : closedPR.head.repo != null &&
                  run.head_repository?.id === closedPR.head.repo.id &&
                  run.head_branch === closedPR.head.ref;
              if (!matches) continue;

              try {
                await github.rest.actions.cancelWorkflowRun({
                  ...context.repo,
                  run_id: run.id,
                });
                core.info(`Cancelled run ${run.id} for PR #${closedPR.number}`);
              } catch (error) {
                // A run can finish between listing it and cancelling it.
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} is no longer cancellable`);
              }
            }

  nix-fmt-check:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: fmt
        run: find . -iname '*.nix' -exec nix run .#nixfmt -- --check {} +
      - name: check
        run: nix flake check

  native-linux:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { ocaml-version: 4_14, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_1, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_2, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_3, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_4, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_5, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_5_fp, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_6, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_5, continue-on-error: false, os: ubuntu-26.04-arm, platform: aarch64-linux }
          - { ocaml-version: 5_6, continue-on-error: false, os: ubuntu-26.04-arm, platform: aarch64-linux }
    name: Native packages (${{ matrix.setup.os }}, OCaml ${{ matrix.setup.ocaml-version }})
    runs-on: ${{ matrix.setup.os }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
      - uses: nix-ocaml/nix-s3-action@fork
        with:
          skipPush: true
          endpoint: "s3://overlays?endpoint=https://7a53c28e9b7a91239f9ed42da04276bc.r2.cloudflarestorage.com"
          signingKey: ${{ secrets.R2_SIGNING_KEY }}
          awsAccessKeyId: ${{ secrets.R2_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.R2_SECRET_ACESS_KEY }}
      - name: Build nix packages
        run: ./ci.sh ${{ matrix.setup.platform }} build_${{ matrix.setup.ocaml-version }}
        continue-on-error: ${{ matrix.setup.continue-on-error }}
      - name: Upload build report
        id: report-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: nix-ci-build-${{ matrix.setup.platform }}-ocaml-${{ matrix.setup.ocaml-version }}-native-attempt-${{ github.run_attempt }}
          path: nix-ci-build-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link build report
        if: ${{ always() && steps.report-artifact.outputs.artifact-url != '' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download build report and full logs](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  top-level-packages:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { os: ubuntu-latest, target: x86_64-linux }
          - { os: macos-latest, target: aarch64-darwin }
    name: Native (Top-level) packages (${{ matrix.setup.os }})
    runs-on: ${{ matrix.setup.os }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
      - uses: nix-ocaml/nix-s3-action@fork
        with:
          skipPush: true
          endpoint: "s3://overlays?endpoint=https://7a53c28e9b7a91239f9ed42da04276bc.r2.cloudflarestorage.com"
          signingKey: ${{ secrets.R2_SIGNING_KEY }}
          awsAccessKeyId: ${{ secrets.R2_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.R2_SECRET_ACESS_KEY }}
      - name: Build nix packages
        run: ./ci.sh ${{ matrix.setup.target }} build_top-level-packages
      - name: Upload build report
        id: report-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: nix-ci-build-${{ matrix.setup.target }}-top-level-attempt-${{ github.run_attempt }}
          path: nix-ci-build-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link build report
        if: ${{ always() && steps.report-artifact.outputs.artifact-url != '' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download build report and full logs](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  native-macos:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 4_14, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_2, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_3, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_4, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_5, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_5_fp, continue-on-error: false }
          - { os: macos-latest, target: aarch64-darwin, ocaml-version: 5_6, continue-on-error: false }
    name: Native packages (macOS (${{ matrix.setup.os }}), OCaml ${{ matrix.setup.ocaml-version }})
    runs-on: ${{ matrix.setup.os }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
            accept-flake-config = true
      - uses: nix-ocaml/nix-s3-action@fork
        with:
          skipPush: true
          endpoint: "s3://overlays?endpoint=https://7a53c28e9b7a91239f9ed42da04276bc.r2.cloudflarestorage.com"
          signingKey: ${{ secrets.R2_SIGNING_KEY }}
          awsAccessKeyId: ${{ secrets.R2_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.R2_SECRET_ACESS_KEY }}
      - name: Build nix packages
        run: ./ci.sh ${{ matrix.setup.target }} build_${{ matrix.setup.ocaml-version }}
        continue-on-error: ${{ matrix.setup.continue-on-error }}
      - name: Upload build report
        id: report-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: nix-ci-build-${{ matrix.setup.target }}-ocaml-${{ matrix.setup.ocaml-version }}-native-attempt-${{ github.run_attempt }}
          path: nix-ci-build-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link build report
        if: ${{ always() && steps.report-artifact.outputs.artifact-url != '' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download build report and full logs](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  cross-compilers:
    if: github.event_name != 'pull_request_target'
    # needs: [native-linux]
    strategy:
      fail-fast: false
      matrix:
        setup:
          - { ocaml-version: 4_14, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_1, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_2, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_3, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_4, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_5, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_6, continue-on-error: false, os: ubuntu-latest, platform: x86_64-linux }
          - { ocaml-version: 5_5, continue-on-error: false, os: ubuntu-24.04-arm, platform: aarch64-linux }
          - { ocaml-version: 5_6, continue-on-error: false, os: ubuntu-24.04-arm, platform: aarch64-linux }
        target:
          - arm64
          - musl
    name: ${{matrix.target}} packages (OCaml ${{ matrix.setup.ocaml-version }}, ${{ matrix.setup.os }})
    runs-on: ${{ matrix.setup.os }}
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
      - uses: nix-ocaml/nix-s3-action@fork
        with:
          skipPush: true
          endpoint: "s3://overlays?endpoint=https://7a53c28e9b7a91239f9ed42da04276bc.r2.cloudflarestorage.com"
          signingKey: ${{ secrets.R2_SIGNING_KEY }}
          awsAccessKeyId: ${{ secrets.R2_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.R2_SECRET_ACESS_KEY }}
      - name: Build nix packages
        run : ./ci.sh ${{ matrix.setup.platform }} ${{matrix.target}}_${{matrix.setup.ocaml-version}}
        continue-on-error: ${{ matrix.setup.continue-on-error }}
      - name: Upload build report
        id: report-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: nix-ci-build-${{ matrix.setup.platform }}-ocaml-${{ matrix.setup.ocaml-version }}-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: nix-ci-build-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link build report
        if: ${{ always() && steps.report-artifact.outputs.artifact-url != '' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download build report and full logs](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  cross-compilers-mingw:
    if: github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        setup:
          # mingw cross-compilation only supported on OCaml 5.4+
          - { ocaml-version: 5_4, continue-on-error: false }
          - { ocaml-version: 5_5, continue-on-error: false }
    name: mingw packages (OCaml ${{ matrix.setup.ocaml-version }})
    runs-on: ubuntu-latest
    env:
      NIXPKGS_ALLOW_UNFREE: 1
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://anmonteiro.nix-cache.workers.dev
            extra-trusted-public-keys = ocaml.nix-cache.com-1:/xI2h2+56rwFfKyyFVbkJSeGqSIYMC/Je+7XXqGKDIY=
      - uses: nix-ocaml/nix-s3-action@fork
        with:
          skipPush: true
          endpoint: "s3://overlays?endpoint=https://7a53c28e9b7a91239f9ed42da04276bc.r2.cloudflarestorage.com"
          signingKey: ${{ secrets.R2_SIGNING_KEY }}
          awsAccessKeyId: ${{ secrets.R2_ACCESS_KEY_ID }}
          awsSecretAccessKey: ${{ secrets.R2_SECRET_ACESS_KEY }}
      - name: Build nix packages
        run : ./ci.sh x86_64-linux mingw_${{matrix.setup.ocaml-version}}
        continue-on-error: ${{ matrix.setup.continue-on-error }}
      - name: Upload build report
        id: report-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: nix-ci-build-x86_64-linux-ocaml-${{ matrix.setup.ocaml-version }}-mingw-attempt-${{ github.run_attempt }}
          path: nix-ci-build-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Link build report
        if: ${{ always() && steps.report-artifact.outputs.artifact-url != '' }}
        env:
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.artifact-url }}
        run: |
          printf '\n[Download build report and full logs](%s)\n' "$REPORT_ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
